syntax = "proto3";

package proto;
// Keep import path aligned with go.mod module name.
// The part after ';' is the generated Go package name.
option go_package = "./proto";

message  EstablishReq{
  string Addr =1;
  int32 Mode=2;
}

message EstablishResponse {
  int32 Mode=1;
  string Err=2;
}

message ShakeHandReq {}

message ShakeHandResp {}

service Maintain {
  rpc Establish(EstablishReq) returns (EstablishResponse) {}
  rpc ShakeHand(ShakeHandReq) returns (ShakeHandResp) {}
}
